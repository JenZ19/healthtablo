<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Семейный хаб здоровья">
  <!-- Иконка хаба: тёплая бумажная плашка, на ней сердце из трёх фигур —
       большая и две поменьше, по числу тех, за кем хаб следит: двое взрослых
       и собака. Через сердце идёт линия пульса — тот же мотив, что и кружок
       в шапке интерфейса. Палитра ровно та же, что в style.css. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8f1"/>
      <stop offset="1" stop-color="#f3ede4"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#paper)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none"
        stroke="#e2d8c8" stroke-width="1.5"/>

  <!-- сердце -->
  <path d="M32 50.5
           C 15.5 39.5 10 32.5 10 25.2
           A 10.6 10.6 0 0 1 32 19.4
           A 10.6 10.6 0 0 1 54 25.2
           C 54 32.5 48.5 39.5 32 50.5 Z"
        fill="#5b7f6b"/>

  <!-- линия пульса поверх сердца -->
  <path d="M14 31 H24 l3.4 -7.6 4.6 15 3.6 -9.4 2.6 4.4 H50"
        fill="none" stroke="#fdf8f1" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- три точки: двое людей и собака -->
  <circle cx="24.4" cy="55.6" r="2.5" fill="#c8809b"/>
  <circle cx="32" cy="55.6" r="2.5" fill="#6f93b8"/>
  <circle cx="39.6" cy="55.6" r="2.5" fill="#94c04a"/>
</svg>
