<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Аватарки для карточек членов семьи. Один файл со спрайтами, чтобы
       не плодить запросы: подключаются через <use href="#av-woman">.
       Рисунок намеренно минималистичный и без лиц — это медицинский
       интерфейс, а не мессенджер. Цвет не задан внутри фигур: он берётся
       от currentColor, то есть от --subject карточки, и каждая аватарка
       автоматически оказывается в цвете своего человека. -->

  <symbol id="av-woman" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="23" fill="currentColor" opacity="0.13"/>
    <!-- волосы -->
    <path d="M13 25c0-7 4.5-12 11-12s11 5 11 12c0 2-.4 3.6-1 5 .4-4.6-1.2-7.4-3-8.6-1.6 1.6-4.3 2.4-7 2.4s-5.4-.8-7-2.4c-1.8 1.2-3.4 4-3 8.6-.6-1.4-1-3-1-5z"
          fill="currentColor"/>
    <!-- лицо -->
    <circle cx="24" cy="22.5" r="7.5" fill="currentColor" opacity="0.55"/>
    <!-- плечи -->
    <path d="M9.5 44c1.4-7 7.2-11 14.5-11s13.1 4 14.5 11c-4 2-9 3-14.5 3S13.5 46 9.5 44z"
          fill="currentColor" opacity="0.8"/>
  </symbol>

  <symbol id="av-man" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="23" fill="currentColor" opacity="0.13"/>
    <!-- короткая стрижка -->
    <path d="M14 22c0-6.2 4.4-10.5 10-10.5S34 15.8 34 22v1.2c-1.1-3-2.4-4.6-3.6-5.3-2 1.3-4.4 1.9-6.4 1.9s-4.4-.6-6.4-1.9c-1.2.7-2.5 2.3-3.6 5.3V22z"
          fill="currentColor"/>
    <circle cx="24" cy="23" r="7.5" fill="currentColor" opacity="0.55"/>
    <path d="M9.5 44c1.4-7 7.2-11 14.5-11s13.1 4 14.5 11c-4 2-9 3-14.5 3S13.5 46 9.5 44z"
          fill="currentColor" opacity="0.8"/>
  </symbol>

  <symbol id="av-dog" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="23" fill="currentColor" opacity="0.13"/>
    <!-- висячие уши болонки -->
    <path d="M13.5 20c-2.2 0-3.8 2.4-3.8 6 0 4.2 2.2 7.4 5 7.4 1 0 1.9-.4 2.6-1.1z"
          fill="currentColor" opacity="0.8"/>
    <path d="M34.5 20c2.2 0 3.8 2.4 3.8 6 0 4.2-2.2 7.4-5 7.4-1 0-1.9-.4-2.6-1.1z"
          fill="currentColor" opacity="0.8"/>
    <!-- морда -->
    <path d="M24 12c6.1 0 10.5 4.6 10.5 11.2 0 7-4.4 12.8-10.5 12.8S13.5 30.2 13.5 23.2C13.5 16.6 17.9 12 24 12z"
          fill="currentColor" opacity="0.55"/>
    <!-- нос -->
    <ellipse cx="24" cy="27.5" rx="2.6" ry="2" fill="currentColor"/>
    <!-- глаза -->
    <circle cx="20" cy="22" r="1.5" fill="currentColor"/>
    <circle cx="28" cy="22" r="1.5" fill="currentColor"/>
  </symbol>
</svg>
