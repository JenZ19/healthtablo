<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход — Семейный хаб здоровья</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Здоровье">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#faf7f2">
</head>
<body class="login-page">
  <main class="login-wrap">
    <form class="login-card" method="post" action="/login">
      <div class="login-mark" aria-hidden="true"></div>
      <h1>Семейный хаб здоровья</h1>
      <p class="login-sub">Вход только для своих.</p>

      {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}

      <label>Логин
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label>Пароль
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn" type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
